services:
  - type: web
    name: meditimeline-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FRONTEND_URL
        sync: false